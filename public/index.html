  const length=audioCtx.sampleRate*3;
  const buffer=audioCtx.createBuffer(1,length,audioCtx.sampleRate);
  const channel=buffer.getChannelData(0);
  for(let i=0;i<length;i++)channel[i]=Math.random()*2-1;
  const source=audioCtx.createBufferSource();source.buffer=buffer;source.loop=true;
  const lowpass=audioCtx.createBiquadFilter();lowpass.type='lowpass';lowpass.frequency.value=730;
  const highpass=audioCtx.createBiquadFilter();highpass.type='highpass';highpass.frequency.value=120;
  const gain=audioCtx.createGain();gain.gain.value=.12;
  // Slow, subtle wash so the sound suggests flowing water rather than static.
  const lfo=audioCtx.createOscillator();lfo.frequency.value=.28;
  const depth=audioCtx.createGain();depth.gain.value=.032;
  lfo.connect(depth);depth.connect(gain.gain);
  source.connect(lowpass);lowpass.connect(highpass);highpass.connect(gain);gain.connect(audioCtx.destination);
  source.start();lfo.start();audioNodes=[source,lfo,lowpass,highpass,gain,depth];
  soundButton.textContent='🔊';soundButton.setAttribute('aria-label','물소리 끄기');toast('물 흐르는 소리를 켰어요 🔊');
 }catch(e){console.error('Audio error',e);stopWaterSound();toast('소리를 켤 수 없어요. 브라우저 음소거를 확인해 주세요.')}
}
soundButton.onclick=()=>{ensureEffectsAudio();if(audioCtx)stopWaterSound();else startWaterSound()};
document.getElementById('testSound').onclick=()=>{if(!ensureEffectsAudio()){toast('브라우저가 오디오를 지원하지 않아요');return}playActionSound('test');toast('🔔 띠링 + 물소리! 소리가 들리나요?')};
let last=performance.now(),send=0;function animate(t){requestAnimationFrame(animate);const dt=Math.min(.05,(t-last)/1000);last=t;
 if(my){let dx=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft'))+jx;let dz=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'))+jz;const mag=Math.hypot(dx,dz);if(mag>.1){dx/=Math.max(1,mag);dz/=Math.max(1,mag);my.root.position.x=THREE.MathUtils.clamp(my.root.position.x+dx*dt*3.2,-15,15);my.root.position.z=THREE.MathUtils.clamp(my.root.position.z+dz*dt*3.2,-11,12);my.root.rotation.y=Math.atan2(-dx,-dz);my.target.copy(my.root.position);if(t-send>60){socket?.emit('move',{x:my.root.position.x,z:my.root.position.z,rot:my.root.rotation.y});send=t}}}
 const near=nearestCapybara();scrubButton.style.display=near?'inline-block':'none';scrubButton.disabled=performance.now()<nextScrubAt;
 for(let i=hearts.length-1;i>=0;i--){const h=hearts[i];h.life-=dt;h.mesh.position.y+=dt*h.velocity;h.mesh.material.opacity=Math.min(1,h.life);if(h.life<=0){scene.remove(h.mesh);h.mesh.material.map.dispose();h.mesh.material.dispose();hearts.splice(i,1)}}
 for(let i=splashes.length-1;i>=0;i--){const p=splashes[i];p.life-=dt;p.vy-=dt*5;p.mesh.position.x+=p.vx*dt;p.mesh.position.y+=p.vy*dt;p.mesh.position.z+=p.vz*dt;p.mesh.material.opacity=Math.max(0,p.life/p.maxLife)*.87;if(p.life<=0||p.mesh.position.y<-.12){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();splashes.splice(i,1)}}
 for(const [id,o] of players){if(id!==myId){o.root.position.lerp(o.target,Math.min(1,dt*8));if(Number.isFinite(o.root.userData.targetRot))o.root.rotation.y=o.root.userData.targetRot}const inWater=Math.abs(o.root.position.x)<8.5&&Math.abs(o.root.position.z)<5;const inBath=inWater&&o.action!=='idle';o.phase+=dt;const bob=inBath?-.2+Math.sin(o.phase*2.8)*.065:Math.sin(o.phase*2.2)*.012;o.pivot.position.y=bob;o.pivot.rotation.z=o.action==='float'?.13*Math.sin(o.phase):0;o.zz.visible=o.action==='sleep';
 const age=(t-o.actionAt)/1000;const scrubbing=(o.scrubbingUntil||0)>t;const receiving=(o.receivingUntil||0)>t;

 if(o.action==='sleep'){

 }else if(o.action==='float'){

 if(scrubbing){o.pivot.rotation.z=Math.sin(t*.027)*.13;o.pivot.rotation.y=Math.sin(t*.023)*.11;o.ears.forEach((ear,i)=>ear.rotation.z=Math.sin(t*.035+i)*.14)}

 if(o.action!=='sleep'){
   o.pivot.rotation.x=(o.action==='float'||o.action==='splash'||o.action==='soak')?o.pivot.rotation.x:0;
 }else{o.pivot.rotation.z=0;}
 if(o.action!=='wave'&&o.action!=='float'&&!scrubbing)o.pivot.rotation.z=0;
 if(o.action!=='wave'&&!scrubbing)o.pivot.rotation.y=0;

 for(let i=0;i<o.ears.length;i++)o.ears[i].rotation.z=Math.sin(o.phase*5+i*1.5)*(o.action==='wave' ? .19 : (receiving ? .12 : .055));
 if(o.fruit.visible){const jump=Math.max(0,1-Math.abs(age-.22)/.22);o.fruit.position.y=.12*jump+Math.sin(o.phase*2)*.015;o.fruit.rotation.z=Math.sin(o.phase*3)*.045;}else{o.fruit.position.y=0;}
 }
 if(my){const want=new THREE.Vector3(my.root.position.x+0,10,my.root.position.z+17);camera.position.lerp(want,Math.min(1,dt*2));camera.lookAt(my.root.position.x,0,my.root.position.z-1)}else{camera.lookAt(0,0,0)}
 if(toastTime&&t>toastTime){toastTime=0;toastBox.style.opacity=0}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
